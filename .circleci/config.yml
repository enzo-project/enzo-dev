version: 2.1

commands:
  set-env:
    description: "Set environment variables."
    steps:
      - run:
          name: "Set environment variables."
          command: |
            echo 'export LD_LIBRARY_PATH=$HOME/local/lib:$LD_LIBRARY_PATH' >> $BASH_ENV
            echo 'export CMAKE_PREFIX_PATH=$HOME/local:$HOME/grackle:$CMAKE_PREFIX_PATH' >> $BASH_ENV
            echo 'export GRACKLE_ROOT=$HOME/local' >> $BASH_ENV
            echo 'export HYPRE_ROOT=$HOME/local' >> $BASH_ENV
            echo 'export ENZOTEST_DIR=$HOME/enzo_test' >> $BASH_ENV
            echo 'export ANSWER_NAME="push_suite"' >> $BASH_ENV
            echo 'export HYPRE=2.20.0' >> $BASH_ENV
            source $BASH_ENV
            # get tags from the main and PR repository (for the current gold standard)
            git fetch --tags https://github.com/enzo-project/enzo-dev
            if [ -n "$CIRCLE_PR_REPONAME" ]; then
              git fetch --tags https://github.com/$CIRCLE_PR_USERNAME/$CIRCLE_PR_REPONAME
            fi
            # tag the tip so we can go back to it
            git tag tip

  install-dependencies:
    description: "Install dependencies."
    steps:
      - run:
          name: "Install dependencies."
          command: |
            source $BASH_ENV
            sudo apt-get update
            sudo apt-get install -y cmake csh libhdf5-serial-dev libopenmpi-dev openmpi-bin gfortran libtool-bin xutils-dev
            python3 -m venv $HOME/venv
            source $HOME/venv/bin/activate
            pip install --upgrade pip
            pip install --upgrade wheel
            pip install --upgrade setuptools
            pip install Cython numpy h5py fastcache flake8 nose3 girder-client matplotlib pytest gitpython yt
            pip install yt_astro_analysis
            # Install hypre
            mkdir -p $HOME/local
            if [ ! -f $HOME/local/lib/libHYPRE.a ]; then
              cd $HOME
              wget https://github.com/hypre-space/hypre/archive/refs/tags/v${HYPRE}.tar.gz
              tar xvfz v${HYPRE}.tar.gz
              cd hypre-${HYPRE}/src
              ./configure --with-MPI --with-MPI-include=/usr/include/mpi --with-MPI-libs=mpi --with-MPI-lib-dirs=/usr/lib --prefix=$HOME/local
              make install
            fi

  install-grackle:
    description: "Install grackle."
    steps:
      - run:
          name: "Install grackle."
          command: |
            git clone -b main https://github.com/grackle-project/grackle $HOME/grackle
            cd $HOME/grackle
            ./configure
            cd src/clib
            make machine-linux-gnu
            make
            make install

  install-docs-dependencies:
    description: "Install dependencies for docs build."
    steps:
      - run:
          name: "Install dependencies for docs build."
          command: |
            sudo apt-get update
            sudo apt-get install -y dvipng texlive-latex-extra
            python3 -m venv $HOME/venv
            source $HOME/venv/bin/activate
            pip install --upgrade pip
            pip install --upgrade wheel
            pip install --upgrade setuptools
            pip install sphinx

  download-test-data:
    description: "Download test data."
    steps:
      - run:
          name: "Download test data."
          command: |
            source $BASH_ENV
            source $HOME/venv/bin/activate
            girder-cli --api-url https://girder.hub.yt/api/v1 download 5af9ef42ec1bd30001fcd001 $HOME/enzo-dev/run/CosmologySimulation

  build-and-test:
    description: "Compile enzo and run tests."
    parameters:
      tag:
        type: string
        default: tip
      skipfile:
        type: string
        default: ""
      flags:
        type: string
        default: ""
    steps:
      - run:
          name: "Compile enzo and run tests."
          no_output_timeout: 20m
          command: |
            source $BASH_ENV
            source $HOME/venv/bin/activate
            if [ ! -e << parameters.skipfile >> ]; then
              git checkout << parameters.tag >>
              cmake -B build -S . -DCMAKE_PREFIX_PATH="$HOME/local;$HOME/grackle" -DGRACKLE_ROOT="$HOME/local" -DHYPRE_ROOT="$HOME/local" -DENZO_USE_GRACKLE=ON -DENZO_USE_HYPRE=ON
              cmake --build build --parallel 6
              cd run
              python ./test_runner.py --suite=push -o $ENZOTEST_DIR --answer-name=$ANSWER_NAME --local --machine=local_nompi --strict=high --verbose --jrun=4 << parameters.flags >>
            fi

  compile-test:
    description: "Test that enzo compiles in a few different configurations."
    steps:
      - run:
          name: "Test compilation configurations."
          command: |
            source $BASH_ENV
            source $HOME/venv/bin/activate
            # test various baryon/particle precisions
            for prec in 32 64
            do for part in 32 128
            do
            if [[ $prec == 64 && $part == 64 ]]; then
              continue
            fi
            cmake -B build -S . -DCMAKE_PREFIX_PATH="$HOME/local;$HOME/grackle" -DGRACKLE_ROOT="$HOME/local" -DHYPRE_ROOT="$HOME/local" -DENZO_PRECISION=$prec -DENZO_PARTICLES=$part -DENZO_USE_GRACKLE=ON -DENZO_USE_HYPRE=ON
            cmake --build build --parallel 6 || exit 1
            done ; done
            # test 32-bit integers and 32-bit particle IDs
            cmake -B build -S . -DCMAKE_PREFIX_PATH="$HOME/local;$HOME/grackle" -DGRACKLE_ROOT="$HOME/local" -DHYPRE_ROOT="$HOME/local" -DENZO_INTEGERS=32 -DENZO_PARTICLE_IDS=32 -DENZO_USE_GRACKLE=ON -DENZO_USE_HYPRE=ON
            cmake --build build --parallel 6 || exit 1
            # test without mpi
            cmake -B build -S . -DCMAKE_PREFIX_PATH="$HOME/local;$HOME/grackle" -DGRACKLE_ROOT="$HOME/local" -DHYPRE_ROOT="$HOME/local" -DENZO_USE_MPI=OFF -DENZO_USE_GRACKLE=ON -DENZO_USE_HYPRE=ON
            cmake --build build --parallel 6 || exit 1
            # test without radiative transfer
            cmake -B build -S . -DCMAKE_PREFIX_PATH="$HOME/local;$HOME/grackle" -DGRACKLE_ROOT="$HOME/local" -DHYPRE_ROOT="$HOME/local" -DENZO_TRANSFER=OFF -DENZO_USE_GRACKLE=ON -DENZO_USE_HYPRE=ON
            cmake --build build --parallel 6 || exit 1

  build-docs:
    description: "Test the docs build."
    steps:
      - run:
          name: "Test the docs build."
          command: |
            source $HOME/venv/bin/activate
            cd doc/manual/source
            python -m sphinx -M html "." "_build" -W

jobs:
  test-suite:
    docker:
      - image: cimg/python:3.10

    resource_class: large
    working_directory: ~/enzo-dev

    steps:
      - checkout
      - set-env

      - restore_cache:
          name: "Restore dependencies cache."
          key: dependencies-v6

      - install-dependencies

      - save_cache:
          name: "Save dependencies cache"
          key: dependencies-v6
          paths:
            - ~/.cache/pip
            - ~/venv
            - ~/local
            - ~/grackle

      - install-grackle
      - download-test-data

      - restore_cache:
          name: "Restore test answers."
          key: test-answers-v17

      - build-and-test:
          tag: gold-standard-v17
          skipfile: ~/enzo_test/push_suite
          flags: --answer-store

      - save_cache:
          name: "Save test answers cache."
          key: test-answers-v17
          paths:
            - ~/enzo_test/push_suite

      - build-and-test:
          tag: tip
          skipfile: notafile
          flags: --clobber

      - store_artifacts:
          path: ~/enzo-dev/build/CMakeFiles/CMakeOutput.log

  test-compile-options:
    docker:
      - image: cimg/python:3.10

    resource_class: large
    working_directory: ~/enzo-dev

    steps:
      - checkout
      - set-env

      - restore_cache:
          name: "Restore dependencies cache."
          key: dependencies-v6

      - install-dependencies

      - save_cache:
          name: "Save dependencies cache"
          key: dependencies-v6
          paths:
            - ~/.cache/pip
            - ~/venv
            - ~/local

      - install-grackle
      - compile-test

      - store_artifacts:
          path: ~/enzo-dev/build/CMakeFiles/CMakeOutput.log

  docs-build:
    docker:
      - image: cimg/python:3.10

    working_directory: ~/enzo-dev

    steps:
      - checkout
      - install-docs-dependencies
      - build-docs

workflows:
   version: 2

   tests:
     jobs:
       - test-compile-options
       - test-suite
       - docs-build

   weekly:
     triggers:
       - schedule:
           cron: "0 0 * * 1"
           filters:
            branches:
              only:
                - master

     jobs:
       - test-compile-options
       - test-suite
       - docs-build
